name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  checks:
    if: github.event_name != 'schedule'
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          HUSKY: '0'
      - name: Prepare hook test fixtures
        run: bun run prepare
      - name: Lint
        run: bun run lint
      - name: Type-aware lint
        run: bun run lint:types
      - name: Formatting
        run: bun run format:check
      - name: TypeScript
        run: bun run typecheck
      - name: Tests
        run: bun test

  audit:
    name: Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check for dependency changes
        id: dependencies
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          audit=true
          if [[ "$EVENT_NAME" != schedule && "$EVENT_NAME" != workflow_dispatch ]] &&
             git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null &&
             git cat-file -e "$HEAD_SHA^{commit}" 2>/dev/null; then
            if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- package.json bun.lock; then
              audit=false
            fi
          fi
          echo "audit=$audit" >> "$GITHUB_OUTPUT"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.dependencies.outputs.audit == 'true'
        with:
          bun-version-file: package.json
      - name: Audit locked dependencies
        if: steps.dependencies.outputs.audit == 'true'
        run: bun audit
