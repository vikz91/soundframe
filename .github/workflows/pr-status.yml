name: PR status comment

# The reporter runs trusted default-branch code, with no PR checkout or artifacts.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  contents: read
  pull-requests: write

concurrency:
  group: pr-status-${{ github.event.workflow_run.head_repository.id }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  comment:
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const run = context.payload.workflow_run;
            const repo = context.repo;
            const marker = '<!-- audioframe-ci-status -->';
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
              ...repo, run_id: run.id, filter: 'latest', per_page: 100,
            });
            const checks = ['Lint', 'Formatting', 'TypeScript', 'Tests', 'Build', 'Vulnerabilities'];
            const icons = { success: '✅', failure: '❌', cancelled: '⏹️', skipped: '➖', timed_out: '⏱️' };
            const rows = checks.map(name => {
              const job = jobs.find(item => item.name === name);
              const status = job?.conclusion || 'not run';
              return `| ${name} | ${icons[status] || '⚠️'} ${status} |`;
            });
            const body = [
              marker,
              '### CI results',
              `Commit: \`${run.head_sha.slice(0, 7)}\` · [Workflow run](${run.html_url})`,
              '',
              '| Check | Result |',
              '| --- | --- |',
              ...rows,
              '',
              `<!-- ci-run:${run.id}:${run.run_attempt} -->`,
            ].join('\n');

            // Fork runs can omit pull_requests; resolve associations through the API.
            const associated = run.pull_requests?.length ? run.pull_requests : await github.paginate(
              github.rest.repos.listPullRequestsAssociatedWithCommit,
              { ...repo, commit_sha: run.head_sha, per_page: 100 },
            );
            for (const candidate of associated) {
              const { data: pr } = await github.rest.pulls.get({ ...repo, pull_number: candidate.number });
              if (pr.state !== 'open' || pr.head.sha !== run.head_sha ||
                  pr.head.repo?.id !== run.head_repository.id || pr.head.ref !== run.head_branch) continue;
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...repo, issue_number: pr.number, per_page: 100,
              });
              const previous = comments.find(item =>
                item.user?.login === 'github-actions[bot]' && item.body?.startsWith(marker));
              const previousRun = previous?.body?.match(/<!-- ci-run:(\d+):(\d+) -->/);
              if (previousRun && (Number(previousRun[1]) > run.id ||
                  (Number(previousRun[1]) === run.id && Number(previousRun[2]) > run.run_attempt))) continue;
              if (previous) {
                await github.rest.issues.updateComment({ ...repo, comment_id: previous.id, body });
              } else {
                await github.rest.issues.createComment({ ...repo, issue_number: pr.number, body });
              }
            }
