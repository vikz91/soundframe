name: Release

# Commit hooks own version bumps. Publishing a matching tag chooses a release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        with:
          script: |
            const tag = context.ref.slice('refs/tags/'.length);
            if (!/^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(tag)) {
              throw new Error('Release tags must use stable SemVer: vX.Y.Z.');
            }
            const { data: file } = await github.rest.repos.getContent({
              ...context.repo, path: 'package.json', ref: context.sha,
            });
            const manifest = JSON.parse(Buffer.from(file.content, 'base64').toString('utf8'));
            if (tag !== `v${manifest.version}`) {
              throw new Error('Release tag must match package.json version at the tagged commit.');
            }
            try {
              const { data: existing } = await github.rest.repos.getReleaseByTag({
                ...context.repo, tag,
              });
              core.notice(`Release already exists: ${existing.html_url}`);
              return;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            const { data: release } = await github.rest.repos.createRelease({
              ...context.repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: tag,
              generate_release_notes: true,
            });
            await core.summary.addLink(`Release ${tag}`, release.html_url).write();
